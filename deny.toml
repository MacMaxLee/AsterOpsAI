[graph]
targets = []

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies (contracts/platform/core) are
# deliberately unversioned — that's normal Cargo workspace idiom, not the
# unpinned-external-dependency risk this lint exists to catch.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
