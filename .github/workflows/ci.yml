name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit U4's dbms_*.rs integration tests need real PostgreSQL 13/15/17
      # server instances — not a GitHub Actions `services:` container
      # (those are single, already-running, and passive: they can't be
      # `pg_basebackup`'d into a replica, killed and restarted, or started
      # with a pre-placed TLS cert the way this suite's tests need — see
      # docs/adr/0009-postgresql-adapter-design.md). Same extracted-binary
      # mechanism as local dev, run here explicitly since a fresh runner
      # has nothing cached from a prior run.
      - run: bash scripts/setup-test-postgres.sh
      - run: cargo test --workspace --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-schema-drift.sh

  grep-gate-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-command-outside-exec.sh

  grep-gate-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-sql-outside-adapters.sh

  fr-id-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-fr-id-traceability.sh

  # TRS §20 (unit U15 per TRS's own numbering): "no AI call is reachable
  # from [the correlation engine's] code path" verified by a real
  # dependency-graph check, not just review. cargo-modules has no prebuilt
  # binary distribution (checked: no release assets, not in taiki-e/
  # install-action's manifest), so it's compiled from source once and
  # cached by the pinned-version cache key below rather than rebuilt on
  # every run.
  ai-reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: cache-cargo-modules
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-modules
          key: cargo-modules-0.27.0-${{ runner.os }}
      - if: steps.cache-cargo-modules.outputs.cache-hit != 'true'
        run: cargo install cargo-modules --locked --version 0.27.0
      - run: bash scripts/check-no-ai-reachable-from-correlation.sh

  # Native runners, not cross-compiled from ubuntu-latest: unit U2 added
  # rusqlite's "bundled" feature, which compiles SQLite's C sources via
  # `cc` in a build script. Cross-compiling that C code from Linux to
  # MSVC/macOS ABIs needs a real cross toolchain (xwin/osxcross) that
  # ubuntu-latest doesn't have, so `cargo check --target ...` on ubuntu
  # fails at the C-compile step, not at anything in our own code. Running
  # each check on its native OS sidesteps that entirely and is standard
  # practice once a C dependency enters the graph. macos-latest is an
  # arm64 (Apple Silicon) runner, matching aarch64-apple-darwin natively.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  # Console (unit U3). Only flutter/dart-SDK-level commands run in CI —
  # `flutter test`/`analyze`/`format` and the model codegen all use a
  # bundled headless Dart-VM test harness with no native windowing
  # dependency, so (like check-windows/check-macos above) there's no need
  # for a real GTK/desktop-embedder toolchain here at all.
  console-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: console
        run: flutter pub get
      - working-directory: console
        run: flutter analyze

  console-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: console
        run: flutter pub get
      - working-directory: console
        run: dart format --output=none --set-exit-if-changed .

  console-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: console
        run: flutter pub get
      - working-directory: console
        run: flutter test

  console-codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: console
        run: flutter pub get
      - run: bash scripts/check-console-codegen-drift.sh
