[package]
name = "core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
# The package/directory stays "core" (TRS §3), but the compiled library's
# own crate name is set to "ai_ops_core" here — this is the root fix for
# the "core" vs. sysroot `core` collision (see src/lib.rs's naming note and
# docs/adr/0003-workspace-layout-four-crates.md), not just a workaround for
# one symptom. Without it, both this crate's own doctests AND its own
# `tests/*.rs` integration tests are compiled as a separate binary that
# Cargo self-`--extern`s under the package name "core" — shadowing the
# sysroot `core` inside that binary and breaking any macro-generated code
# that emits `::core::...` paths (thiserror's derive, tokio::test's
# expansion, etc.). Dependents are unaffected either way — the extern name
# a dependent uses is governed by its own Cargo.toml dependency key (see
# `service`'s `ai_ops_core = { package = "core", path = "../core" }`), not
# by this field.
name = "ai_ops_core"

[dependencies]
contracts = { path = "../contracts" }
platform = { path = "../platform" }
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
refinery = { workspace = true }
sha2 = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
async-trait = { workspace = true }
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
keyring = { workspace = true }
tokio-postgres-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
regex = { workspace = true }
csv = { workspace = true }
# Plain HTTP/1.1 client for the Ollama AI provider (unit U6) — no TLS
# backend (Ollama's own default is loopback/LAN plain HTTP; see
# docs/adr/0011). Built directly on hyper's client feature (already a
# workspace-proven crate via `service`'s server-side use) rather than
# pulling in `reqwest`'s much larger dependency surface for one endpoint.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"

[lints.rust]
# Override workspace's `forbid(unsafe_code)` to `deny` for macOS telemetry FFI.
# Allows `#[allow(unsafe_code)]` on specific functions that call Mach APIs.
# See docs/PROGRESS.md "CRITICAL ISSUE" section for rationale and future plan.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
